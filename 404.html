/* Layout: a road case and its paperwork - stencilled case lettering, gaffer-tape labels, spike-tape colour per section, one 68ch reading column with wide breakouts and a contents rail on big screens */
:root{
  color-scheme:dark;
  --bg:#0f1012; --panel:#17191c; --panel2:#1e2125; --ink:#ebe7de; --muted:#a19d93; --line:#2e3136;
  --tape:#f2c230; --tape-ink:#16150f; --hot:#ff6a45; --cue:#59c2ff;
  --s1:#f2c230; --s2:#59c2ff; --s3:#ff6fae; --s4:#7ee07a; --s5:#ff9a3d; --s6:#e9e6df;
  --f-display:"Big Shoulders Stencil Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Permanent Marker","Comic Sans MS","Bradley Hand",cursive;
  --measure:68ch; --wide:980px;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f1eb; --panel:#fffdf8; --panel2:#f7f4ec; --ink:#16171a; --muted:#5d5a53; --line:#d9d4c8;
  --tape:#e7b414; --tape-ink:#16150f; --hot:#c33a1c; --cue:#0b6fb8;
  --s1:#f2c230; --s2:#59c2ff; --s3:#ff8cc0; --s4:#86e082; --s5:#ffad5f; --s6:#ffffff }}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f1eb; --panel:#fffdf8; --panel2:#f7f4ec; --ink:#16171a; --muted:#5d5a53; --line:#d9d4c8;
  --tape:#e7b414; --tape-ink:#16150f; --hot:#c33a1c; --cue:#0b6fb8;
  --s1:#f2c230; --s2:#59c2ff; --s3:#ff8cc0; --s4:#86e082; --s5:#ffad5f; --s6:#ffffff }

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.125rem;line-height:1.62;margin:0}
a{color:var(--cue);text-underline-offset:.16em;text-decoration-thickness:1px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:1rem;top:1rem;background:var(--panel);padding:.5rem;z-index:20}
::selection{background:var(--tape);color:var(--tape-ink)}

.wrap{max-width:calc(var(--wide) + 2rem);margin:0 auto;padding-inline:1rem;padding-block:1rem 4rem}
.col{max-width:var(--measure);margin-inline:auto}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:.4rem;border-bottom:1px solid var(--line)}
.mast a{color:var(--ink);text-decoration:none}
.theme-btn{font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--line);border-radius:3px;padding:.25rem .5rem;cursor:pointer}

/* hero */
.hero{padding-block:2.2rem 1.5rem}
.case-id{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(3.6rem,15vw,9.5rem);line-height:.84;letter-spacing:.01em;text-transform:uppercase;margin:.4rem 0 .9rem;text-wrap:balance}
h1 span{display:block}
h1 .file{color:var(--tape)}
.dek{font-size:clamp(1.12rem,2.6vw,1.35rem);line-height:1.45;color:var(--muted);max-width:44rem;margin:0 0 1.4rem;text-wrap:pretty}
.labels{display:flex;flex-wrap:wrap;gap:.55rem;margin:0 0 1.6rem;padding:0;list-style:none}
.labels li{background:var(--tape);color:var(--tape-ink);font-family:var(--f-hand);font-size:1.02rem;line-height:1;padding:.5rem .7rem .45rem;transform:rotate(var(--r,-1deg));box-shadow:0 1px 0 rgba(0,0,0,.25);clip-path:polygon(2% 0,98% 4%,100% 92%,1% 100%)}
.labels li:nth-child(2){--r:.8deg}.labels li:nth-child(3){--r:-.4deg}.labels li:nth-child(4){--r:1.2deg}.labels li:nth-child(5){--r:-1.4deg}
.labels b{font-family:var(--f-mono);font-weight:600;font-size:.9rem;margin-right:.25rem}

.paths{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:.9rem;display:grid;gap:.6rem}
.paths h2{margin:0;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.path-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(13.5rem,1fr));gap:.6rem}
.path{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem;min-width:0}
.path b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.path p{margin:.25rem 0 .4rem;font-size:.9rem;line-height:1.35;color:var(--muted)}
.path a{font-family:var(--f-mono);font-size:.74rem;margin-right:.55rem;display:inline-block;line-height:1.7}

/* layout with rail */
.layout{display:block}
.rail{display:none}
@media (min-width:1260px){
  .layout{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:2.5rem;max-width:calc(var(--wide) + 17.5rem);margin:0 auto}
  .rail{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 1rem);align-self:start;max-height:calc(100vh - 2rem);overflow:auto;padding-right:.5rem;font-family:var(--f-mono);font-size:.74rem;line-height:1.3}
  .rail a{display:flex;gap:.5rem;padding:.28rem .3rem;color:var(--muted);text-decoration:none;border-left:3px solid transparent}
  .rail a.on{color:var(--ink);border-left-color:var(--tape);background:var(--panel)}
  .rail .n{min-width:1.6rem;color:var(--muted)}

  .wrap.has-rail{max-width:none}
}

/* lede + toc */
.lede{font-size:1.22rem;line-height:1.6;margin-top:1.8rem}
.lede > p:first-of-type::first-letter{font-family:var(--f-display);font-weight:900;float:left;font-size:4.4em;line-height:.8;padding:.06em .1em 0 0;color:var(--tape)}
nav.toc{margin:2.2rem 0;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:1rem 1.1rem}
nav.toc h2{margin:0 0 .6rem;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav.toc ol{list-style:none;margin:0;padding:0;columns:2 17rem;column-gap:2rem}
nav.toc li{break-inside:avoid;padding:.18rem 0;font-size:1rem;line-height:1.3}
nav.toc a{color:var(--ink);text-decoration:none;display:flex;gap:.55rem}
nav.toc a:hover{color:var(--tape)}
.chip-n{font-family:var(--f-mono);font-size:.72rem;font-weight:600;color:var(--tape-ink);background:var(--sc,var(--tape));min-width:1.9rem;text-align:center;padding:.12rem .25rem;border-radius:2px;height:fit-content;margin-top:.15rem}

/* article */
article h2{font-family:var(--f-display);font-weight:900;font-size:clamp(2.1rem,6vw,3.3rem);line-height:.95;letter-spacing:.01em;text-transform:uppercase;margin:4.2rem 0 1rem;text-wrap:balance;scroll-margin-top:1rem}
article h2 .tape{display:inline-block;vertical-align:.5em;margin-right:.55rem;font-family:var(--f-hand);font-weight:400;font-size:.36em;letter-spacing:0;text-transform:none;color:var(--tape-ink);background:var(--sc,var(--tape));padding:.3em .5em .22em;transform:rotate(-2deg);clip-path:polygon(3% 0,97% 6%,100% 94%,0 100%)}
article h3{font-family:var(--f-body);font-weight:600;font-size:1.32rem;line-height:1.25;margin:2.2rem 0 .55rem;text-wrap:balance}
article p{margin:0 0 1.05rem;text-wrap:pretty}
article strong{font-weight:600}
article ul,article ol{padding-left:1.25rem;margin:0 0 1.05rem}
article li{margin-bottom:.35rem}
article p strong:first-child:is(:only-child,:first-child){}
.short{border-left:4px solid var(--sc,var(--tape));background:var(--panel);padding:.85rem 1rem;border-radius:0 6px 6px 0;font-size:1.06rem}
article code{font-family:var(--f-mono);font-size:.84em;background:var(--panel2);padding:.05em .3em;border-radius:3px}
.tbl{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:6px}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem;line-height:1.35}
.tbl th,.tbl td{text-align:left;padding:.5rem .65rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--panel)}
.tbl tr:last-child td{border-bottom:0}
.tbl td{font-variant-numeric:tabular-nums}
sup{line-height:0}
a.footnote-ref{font-family:var(--f-mono);font-size:.66rem;text-decoration:none;padding:0 .08em;color:var(--muted)}
a.footnote-ref:hover{color:var(--tape)}
a.footnote-ref::before{content:"["}a.footnote-ref::after{content:"]"}

/* breakouts */
.wide{max-width:var(--wide);margin-inline:auto}
.fig{margin:2rem auto;display:grid;gap:.8rem}
.fig.pair{grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
.fig figure{margin:0;min-width:0}
.fig .frame{display:block;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;aspect-ratio:4/3}
.fig img{display:block;width:100%;height:100%;object-fit:cover}
.fig .fallback{display:none;position:absolute;inset:0;padding:1rem;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);align-content:center;justify-items:start;gap:.3rem}
.fig .frame.broken img{display:none}
.fig .frame.broken .fallback{display:grid}
.fig figcaption{font-size:.86rem;line-height:1.4;color:var(--muted);margin-top:.45rem}
.fig figcaption b{color:var(--ink);font-weight:600}
.fig .credit{display:block;font-family:var(--f-mono);font-size:.68rem;margin-top:.2rem}
.fig .credit a{color:var(--muted)}

.diagram{margin:2rem auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.9rem .9rem .6rem}
.diagram .dhead{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tape);margin-bottom:.4rem}
.dscroll{overflow-x:auto}
.dg{display:block;width:100%;min-width:560px;height:auto}
.dg .bx{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
.dg .bx.acc{stroke:var(--tape);stroke-width:2}
.dg .bx.hot{stroke:var(--hot);stroke-width:2}
.dg .bx.panel{fill:var(--bg);stroke:var(--tape);stroke-width:1}
.dg .t{fill:var(--ink);font-family:var(--f-mono);font-weight:600;font-size:13px}
.dg .t.sm{font-size:11.5px}
.dg .s{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.dg .s.xs{font-size:10.5px}
.dg .s.cap{fill:var(--tape);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.dg .s.lbl{font-size:10px}
.dg .s.hot{fill:var(--hot)}
.dg .w{stroke:var(--muted);stroke-width:1.8;fill:none}
.dg .w.acc{stroke:var(--tape)}
.dg .ah{fill:var(--muted)}.dg .aha{fill:var(--tape)}
.dg .grid{stroke:var(--line);stroke-width:1}
.dg .head{fill:var(--muted);opacity:.55}
.dg .sep{stroke:var(--hot);stroke-width:1.5;stroke-dasharray:6 5}
.dg .beam{stroke:var(--s4);stroke-width:2.2;fill:none;opacity:.9}
.dg .beam.scan{stroke:var(--hot);stroke-dasharray:4 4}

/* modules */
.mod{margin:2.2rem auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.mod-head{padding:.9rem 1rem .8rem;border-bottom:1px solid var(--line)}
.mod-head .kicker{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tape)}
.mod-head h3{margin:.15rem 0 0;font-family:var(--f-display);font-weight:800;font-size:1.65rem;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.mod-head p{margin:.35rem 0 0;font-size:.94rem;color:var(--muted);line-height:1.4}
.mod-body{padding:1rem}
.mod-foot{padding:.55rem 1rem;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:.7rem;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.mod-foot a{color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:.35rem}
.seg button{font:600 .78rem var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.3rem .65rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.field{display:flex;flex-direction:column;gap:.25rem;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.field input,.field select{font:500 1rem var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.5rem .55rem;width:100%;min-width:0;letter-spacing:0;text-transform:none}
.btn{font:600 .85rem var(--f-mono);color:var(--tape-ink);background:var(--tape);border:0;border-radius:4px;padding:.55rem .9rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.count{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}

/* timeline */
.tl{list-style:none;margin:.9rem 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:5.6rem;top:.4rem;bottom:.4rem;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:5rem minmax(0,1fr);gap:1.4rem;padding:.5rem 0;position:relative}
.tl li::before{content:"";position:absolute;left:5.35rem;top:.95rem;width:10px;height:10px;border-radius:50%;background:var(--ec,var(--tape))}
.tl .d{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);padding-top:.25rem;text-align:right;font-variant-numeric:tabular-nums}
.tl .l{font-weight:600;font-size:1.02rem;line-height:1.3}
.tl .x{font-size:.92rem;line-height:1.42;color:var(--muted)}
.tl .x a{font-family:var(--f-mono);font-size:.68rem;margin-left:.2rem;white-space:nowrap}
.tl-box{max-height:30rem;overflow:hidden;position:relative}
.tl-box.open{max-height:none}
.tl-box:not(.open)::after{content:"";position:absolute;inset:auto 0 0 0;height:5rem;background:linear-gradient(transparent,var(--panel))}

/* glossary */
.gl-tools{display:grid;gap:.7rem}
.gl-list{list-style:none;margin:.9rem 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.6rem}
.gl-list li{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.65rem .75rem;min-width:0}
.gl-list dfn{font-style:normal;font-weight:600;font-size:1.04rem}
.gl-list .aka{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:.3rem}
.gl-list .cat{display:inline-block;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tape-ink);background:var(--gc,var(--tape));padding:.05rem .35rem;border-radius:2px;margin-bottom:.3rem}
.gl-list p{margin:.25rem 0 0;font-size:.92rem;line-height:1.42;color:var(--muted)}
.gl-list .more{font-family:var(--f-mono);font-size:.68rem;margin-top:.35rem;display:inline-block}

/* roles */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:.6rem}
.roles details{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.6rem .75rem;min-width:0}
.roles summary{cursor:pointer;list-style:none}
.roles summary::-webkit-details-marker{display:none}
.roles summary b{display:block;font-size:1.02rem}
.roles summary span{font-size:.88rem;color:var(--muted);line-height:1.35;display:block}
.roles .rd{font-size:.92rem;line-height:1.45;margin-top:.5rem}
.roles .rd dl{margin:.4rem 0 0;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.roles .rd dt{text-transform:uppercase;letter-spacing:.06em}
.roles .rd dd{margin:0 0 .35rem;color:var(--ink);font-family:var(--f-body);font-size:.88rem}

/* toolbox */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:.8rem}
.tool{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.85rem;display:grid;gap:.65rem;align-content:start;min-width:0}
.tool h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.tool .row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.out{border-top:1px dashed var(--line);padding-top:.6rem;display:grid;gap:.3rem}
.out .big{font-family:var(--f-mono);font-weight:600;font-size:1.5rem;color:var(--tape);line-height:1.1;font-variant-numeric:tabular-nums}
.out p{margin:0;font-size:.86rem;line-height:1.4;color:var(--muted)}
.out .warn{color:var(--hot)}
.tool .src{font-family:var(--f-mono);font-size:.66rem;color:var(--muted)}
.tool .src a{color:var(--muted)}

/* checklist */
.check{list-style:none;margin:0;padding:0;display:grid;gap:.15rem}
.check li{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0;border-bottom:1px solid var(--line)}
.check input{width:1.15rem;height:1.15rem;margin-top:.2rem;accent-color:var(--tape);flex:none}
.check label{font-size:.98rem;line-height:1.4;cursor:pointer}
.check h4{margin:.8rem 0 .2rem;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tape)}
.check li.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--tape)}

/* resources */
.res{list-style:none;margin:.8rem 0 0;padding:0;display:grid;gap:.45rem}
.res li{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.7rem;padding:.45rem 0;border-bottom:1px solid var(--line)}
.res .ty{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:.2rem}
.res a{font-weight:600}
.res p{margin:.1rem 0 0;font-size:.9rem;color:var(--muted);line-height:1.4}

/* faq, refs, footer */
.faq details{border-bottom:1px solid var(--line);padding:.7rem 0}
.faq summary{cursor:pointer;font-weight:600;font-size:1.06rem;line-height:1.35}
.faq details p{margin:.45rem 0 0;font-size:1rem;color:var(--muted)}
.cite{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.85rem 1rem;margin:1.4rem 0;font-size:.95rem}
.cite code{display:block;font-family:var(--f-mono);font-size:.78rem;white-space:pre-wrap;overflow-wrap:anywhere;margin:.4rem 0 .6rem}
.refs{margin-top:3.5rem;border-top:2px solid var(--line);padding-top:1rem}
.refs hr{display:none}
.refs ol{padding-left:2.6rem;margin:0;font-size:.88rem;line-height:1.45;color:var(--muted)}
.refs li{margin-bottom:.4rem;overflow-wrap:anywhere}
.refs li::marker{font-family:var(--f-mono);font-size:.74rem;color:var(--tape)}
.refs li p{margin:0;display:inline}
.refs a.footnote-backref{text-decoration:none;margin-left:.25rem}
.sisters{margin-top:3rem;border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem;display:grid;gap:.4rem;background:var(--panel)}
.sisters h2{margin:0;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sisters ul{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.sisters a{font-weight:600}
.sisters span{font-size:.92rem;color:var(--muted)}
footer{margin-top:2rem;border-top:1px solid var(--line);padding-top:.8rem;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;justify-content:space-between}
footer a{color:var(--muted)}
.in-frame .site-only{display:none!important}

/* breakouts: diagrams, figures, tables and tools widen past the text column, measured against the content column */
.main{container-type:inline-size;min-width:0}
.col .wide{width:min(var(--wide),100cqw);max-width:none;position:relative;left:50%;transform:translateX(-50%)}
article h2{scroll-margin-top:1.6rem}

.dscroll{position:relative}
@media (max-width:620px){.diagram .dhead::after{content:" · swipe to see all";color:var(--muted)}}
.roles summary b::after{content:" +";color:var(--tape);font-family:var(--f-mono);font-weight:600}
.roles details[open] summary b::after{content:" -"}

/* scene grid */
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.6rem}
.scene{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--tape);border-radius:6px;padding:.7rem .8rem;min-width:0}
.scene:nth-child(6n+2){border-left-color:var(--s2)}.scene:nth-child(6n+3){border-left-color:var(--s3)}.scene:nth-child(6n+4){border-left-color:var(--s4)}.scene:nth-child(6n+5){border-left-color:var(--s5)}.scene:nth-child(6n+6){border-left-color:var(--s6)}
.sc-top b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.sc-top span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.scene p{margin:.4rem 0 0;font-size:.9rem;line-height:1.4}
.scene .lab{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* corrections */
.corr{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1rem}
.corr h4{margin:0 0 .4rem;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tape)}
.corr p{margin:0 0 .6rem;font-size:.95rem}
.report{margin:1.6rem 0 0;font-family:var(--f-mono);font-size:.72rem}
.report a{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;margin-top:.6rem;font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:2px;margin-right:.35rem;vertical-align:-1px}
.sc-top span{display:block;line-height:1.4;margin-top:.15rem}
